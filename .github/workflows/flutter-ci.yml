name: Flutter CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: 🛒 Checkout code
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🎨 Format
        run: dart format --output=none --set-exit-if-changed .

      - name: 📝 Create dummy .env
        run: touch .env

      - name: 🔍 Analyze
        run: flutter analyze

      - name: 🧪 Run tests
        run: flutter test

      - name: 📊 SonarCloud scan
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: frontend
          args: >
            -Dsonar.projectKey=ADNAN-ZEYA_SafeChat-2.0
            -Dsonar.organization=adnan-zeya
            -Dsonar.sources=lib

      - name: 🔑 Write .env for release build
        # This app reads its backend URL via flutter_dotenv (.env), NOT
        # --dart-define / String.fromEnvironment — see
        # lib/core/network/dio_client.dart. A --dart-define here would be
        # silently ignored by the app, so the deployed backend URL is
        # written into .env instead, overwriting the empty dummy file from
        # the "Create dummy .env" step above.
        #
        # TODO(adnan): API_BASE_URL is not currently defined anywhere in this
        # repo's secrets — confirm the exact secret name and add it to the
        # "production" environment (Settings > Environments > production),
        # the same scope GCP_SA_KEY / GCP_PROJECT_ID already live in.
        run: |
          if [ -z "${{ secrets.API_BASE_URL }}" ]; then
            echo "::error::secrets.API_BASE_URL is not set in the 'production' environment. Add it before this build can target the real backend."
            exit 1
          fi
          echo "API_BASE_URL=${{ secrets.API_BASE_URL }}" > .env

      - name: 🔑 Write google-services.json for release build
        # google-services.json is gitignored (same reasoning as the real
        # .env) — decode it from a base64 GitHub secret instead. Required by
        # the Google Services Gradle plugin; without it `assembleRelease`
        # fails with "File google-services.json is missing."
        run: |
          if [ -z "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "::error::secrets.GOOGLE_SERVICES_JSON_BASE64 is not set in the 'production' environment."
            exit 1
          fi
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/google-services.json

      - name: 🔑 Write release keystore for release build
        run: |
          if [ -z "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "::error::secrets.RELEASE_KEYSTORE_BASE64 is not set in the 'production' environment."
            exit 1
          fi
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks

      - name: 🏗️ Build release APK
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: flutter build apk --release

      - name: 📦 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: safechat-release-apk
          path: frontend/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
